services:
  db:
    image: postgres:16-alpine
    container_name: ccdclinic_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccdclinic_api
    depends_on:
      - db
    env_file:
      - .env
    # Note: Environment variables are loaded from .env file
    # For Docker: DATABASE_URL, JWT_SECRET, CLIENT_URL should be in .env
    # For Render: Set these in the Render dashboard environment variables
    ports:
      - "8000:8000"

volumes:
  ccdclinic_db_data:
